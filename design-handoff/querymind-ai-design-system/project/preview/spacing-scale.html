<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--qm-font-body);padding:22px 28px}
  .r{display:flex;align-items:center;gap:14px;padding:4px 0}
  .tok{font-family:var(--qm-font-mono);font-size:11px;color:var(--accent);width:108px;flex:none}
  .px{font-family:var(--qm-font-mono);font-size:11px;color:var(--fg-3);width:42px;flex:none}
  .bar{height:14px;background:rgba(52,220,203,.5);border-radius:3px}
</style></head>
<body>
  <div class="r"><span class="tok">space-2</span><span class="px">4</span><span class="bar" style="width:4px"></span></div>
  <div class="r"><span class="tok">space-3</span><span class="px">8</span><span class="bar" style="width:8px"></span></div>
  <div class="r"><span class="tok">space-4</span><span class="px">12</span><span class="bar" style="width:12px"></span></div>
  <div class="r"><span class="tok">space-5</span><span class="px">16</span><span class="bar" style="width:16px"></span></div>
  <div class="r"><span class="tok">space-6</span><span class="px">20</span><span class="bar" style="width:20px"></span></div>
  <div class="r"><span class="tok">space-7</span><span class="px">24</span><span class="bar" style="width:24px"></span></div>
  <div class="r"><span class="tok">space-8</span><span class="px">32</span><span class="bar" style="width:32px"></span></div>
  <div class="r"><span class="tok">space-9</span><span class="px">40</span><span class="bar" style="width:40px"></span></div>
  <div class="r"><span class="tok">space-10</span><span class="px">48</span><span class="bar" style="width:48px"></span></div>
  <div class="r"><span class="tok">space-11</span><span class="px">64</span><span class="bar" style="width:64px"></span></div>
</body></html>
