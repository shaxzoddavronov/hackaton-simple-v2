<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--qm-font-body);padding:22px 28px}
  .scale{display:flex;flex-direction:column;gap:2px}
  .r{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--border-subtle)}
  .r:last-child{border-bottom:0}
  .tok{font-family:var(--qm-font-mono);font-size:11px;color:var(--accent);width:70px;flex:none}
  .px{font-family:var(--qm-font-mono);font-size:11px;color:var(--fg-3);width:78px;flex:none}
  .ex{color:var(--fg-0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body>
  <div class="scale">
    <div class="r"><span class="tok">display</span><span class="px">40 / 44</span><span class="ex" style="font-family:var(--qm-font-display);font-size:24px;font-weight:700;letter-spacing:-.02em">Ask your data</span></div>
    <div class="r"><span class="tok">h1</span><span class="px">30 / 36</span><span class="ex" style="font-family:var(--qm-font-display);font-size:21px;font-weight:600">Heading one</span></div>
    <div class="r"><span class="tok">h2</span><span class="px">23 / 30</span><span class="ex" style="font-family:var(--qm-font-display);font-size:18px;font-weight:600">Heading two</span></div>
    <div class="r"><span class="tok">h3</span><span class="px">18 / 26</span><span class="ex" style="font-size:16px;font-weight:600">Heading three</span></div>
    <div class="r"><span class="tok">body</span><span class="px">15 / 23</span><span class="ex" style="font-size:15px">Body copy for reading</span></div>
    <div class="r"><span class="tok">caption</span><span class="px">12 / 16</span><span class="ex" style="font-size:12px;color:var(--fg-2)">Caption · meta</span></div>
    <div class="r"><span class="tok">data</span><span class="px">13.5 mono</span><span class="ex" style="font-family:var(--qm-font-mono);font-size:13px">1,204 · tabular</span></div>
  </div>
</body></html>
