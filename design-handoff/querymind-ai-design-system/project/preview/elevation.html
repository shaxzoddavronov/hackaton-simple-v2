<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-0);color:var(--fg-1);font-family:var(--qm-font-body);padding:30px 28px;display:flex;gap:22px;align-items:center;justify-content:center}
  .item{text-align:center}
  .box{width:104px;height:64px;background:var(--bg-2);border:1px solid var(--border-subtle);border-radius:var(--qm-radius-lg);display:flex;align-items:center;justify-content:center;font-family:var(--qm-font-mono);font-size:10px;color:var(--fg-3)}
  .cap{font-family:var(--qm-font-mono);font-size:10px;color:var(--fg-2);margin-top:11px}
  .cap b{color:var(--accent);font-weight:600}
</style></head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--qm-shadow-1)">rest</div><div class="cap"><b>shadow-1</b><br>cards at rest</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--qm-shadow-2)">float</div><div class="cap"><b>shadow-2</b><br>menus · popovers</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--qm-shadow-3)">modal</div><div class="cap"><b>shadow-3</b><br>dialogs</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--qm-glow-accent);border-color:rgba(52,220,203,.35)">focus</div><div class="cap"><b>glow-accent</b><br>composer · live</div></div>
</body></html>
