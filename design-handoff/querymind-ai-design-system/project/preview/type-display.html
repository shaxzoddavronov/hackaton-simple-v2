<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--qm-font-body);padding:26px 28px}
  .row{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--border-subtle);padding:12px 0}
  .row:last-child{border-bottom:0}
  .meta{font-family:var(--qm-font-mono);font-size:11px;color:var(--fg-3);width:118px;flex:none;letter-spacing:.02em}
  .specimen{font-family:var(--qm-font-display);color:var(--fg-0)}
</style></head>
<body>
  <div class="row"><span class="meta">Display · 40/700</span><span class="specimen" style="font-size:40px;line-height:1;letter-spacing:-.02em">Ask your data</span></div>
  <div class="row"><span class="meta">H1 · 30/600</span><span class="specimen" style="font-size:30px;line-height:1;letter-spacing:-.015em">Most active users</span></div>
  <div class="row"><span class="meta">H2 · 23/600</span><span class="specimen" style="font-size:23px;line-height:1;letter-spacing:-.01em">Workspace connections</span></div>
</body></html>
