<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--qm-font-body);padding:26px 28px}
  .row{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--border-subtle);padding:11px 0}
  .row:last-child{border-bottom:0}
  .meta{font-family:var(--qm-font-mono);font-size:11px;color:var(--fg-3);width:118px;flex:none}
</style></head>
<body>
  <div class="row"><span class="meta">H3 · 18/600</span><span style="font-size:18px;font-weight:600;color:var(--fg-0)">Schedule a report</span></div>
  <div class="row"><span class="meta">Title · 15/600</span><span style="font-size:15px;font-weight:600;color:var(--fg-0)">Test connection before saving</span></div>
  <div class="row"><span class="meta">Body · 15/400</span><span style="font-size:15px;line-height:23px;color:var(--fg-1)">Ask a question in your own language — QueryMind plans the query, runs it, and returns a typed answer.</span></div>
  <div class="row"><span class="meta">Caption · 12/500</span><span style="font-size:12px;font-weight:500;color:var(--fg-2)">Last crawled 4 minutes ago · 1,204 chunks</span></div>
  <div class="row"><span class="meta">Overline · 11/600</span><span style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)">Connections</span></div>
</body></html>
