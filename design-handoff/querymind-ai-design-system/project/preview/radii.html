<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bg-1);color:var(--fg-1);font-family:var(--qm-font-body);padding:24px 28px;display:flex;gap:18px;align-items:flex-end}
  .item{text-align:center}
  .box{width:90px;height:74px;background:var(--bg-2);border:1px solid var(--border)}
  .cap{font-family:var(--qm-font-mono);font-size:10px;color:var(--fg-2);margin-top:9px}
  .cap b{color:var(--accent);font-weight:600}
</style></head>
<body>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="cap"><b>sm</b> · 6<br>chip / input</div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="cap"><b>md</b> · 10<br>button / menu</div></div>
  <div class="item"><div class="box" style="border-radius:14px"></div><div class="cap"><b>lg</b> · 14<br>card / bubble</div></div>
  <div class="item"><div class="box" style="border-radius:20px"></div><div class="cap"><b>xl</b> · 20<br>modal / composer</div></div>
  <div class="item"><div class="box" style="border-radius:999px;width:74px"></div><div class="cap"><b>pill</b> · 999<br>dot / tag</div></div>
</body></html>
