{{- /*
QueryMind credentials. JWT_SECRET and QM_MASTER_KEY are REQUIRED — the
backend lifespan hook (main.py::_check_secrets) refuses to start in
production when these are empty or the dev defaults.
*/ -}}
{{- $jwt := required "secrets.jwtSecret is required (>=32 chars). Generate with: openssl rand -base64 48" .Values.secrets.jwtSecret -}}
{{- $master := required "secrets.qmMasterKey is required (base64 32 bytes). Generate with: python -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())'" .Values.secrets.qmMasterKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "querymind.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "querymind.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  JWT_SECRET: {{ $jwt | quote }}
  QM_MASTER_KEY: {{ $master | quote }}
  DATABASE_URL: {{ include "querymind.databaseUrl" . | quote }}
  REDIS_URL: {{ include "querymind.redisUrl" . | quote }}
  VLLM_API_KEY: {{ .Values.secrets.vllmApiKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
