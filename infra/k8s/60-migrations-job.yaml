# QueryMind AI — Alembic migrations runner.
#
# Apply this between Postgres becoming Ready and scaling the backend up.
# Deletes itself 10 minutes after success (ttlSecondsAfterFinished: 600).
#
# For Helm, this is wrapped as a `pre-install,pre-upgrade` hook so
# `helm upgrade` runs migrations automatically before rolling the API
# pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-upgrade
  namespace: querymind
  labels:
    app.kubernetes.io/name: querymind
    app.kubernetes.io/component: migrations
    app.kubernetes.io/version: "0.1.0"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: querymind
        app.kubernetes.io/component: migrations
        app.kubernetes.io/version: "0.1.0"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: alembic
          image: querymind/backend:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: querymind-config
            - secretRef:
                name: querymind-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
