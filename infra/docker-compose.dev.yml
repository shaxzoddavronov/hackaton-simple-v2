# QueryMind AI — development stack.
#
# Brings up the metadata Postgres (with pgcrypto bootstrap) and Redis for
# Celery. vLLM is intentionally not started here; most users run it on the
# host so it can see the GPU directly. See the commented-out service below
# for an in-stack option.

services:
  postgres:
    # Drop-in replacement for postgres:16 that ships the `vector` extension
    # required by the RAG layer (migration 0002_rag). pgcrypto is also
    # present, so the existing init script keeps working.
    image: pgvector/pgvector:pg16
    container_name: qm_postgres
    environment:
      POSTGRES_DB: querymind
      POSTGRES_USER: querymind
      POSTGRES_PASSWORD: querymind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run once on an empty data dir. pgcrypto must be
      # installed before Alembic migrations create tables that default to
      # gen_random_uuid().
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querymind -d querymind"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - qm_dev

  redis:
    image: redis:7-alpine
    container_name: qm_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - qm_dev

  # Uncomment to run vLLM in-stack — most users run vLLM on the host for GPU access.
  # Requires NVIDIA Container Toolkit. The command mirrors the host serving
  # command documented in infra/README.md.
  #
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   container_name: qm_vllm
  #   command: >
  #     --model google/gemma-3-4b-it
  #     --guided-decoding-backend xgrammar
  #     --max-model-len 8192
  #     --port 8000
  #   ports:
  #     - "8000:8000"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: ["gpu"]
  #   networks:
  #     - qm_dev

  # Triton Inference Server — serves bge-m3 dense embeddings for the
  # RAG layer. Built from ./triton/Dockerfile so sentence-transformers
  # and CPU torch are baked in. First start downloads bge-m3 (~2 GB)
  # into the named `triton_cache` volume; subsequent starts use the
  # cache.
  #
  # The agent gracefully falls back to BM25 schema pruning when this
  # service is offline (see services/rag/retriever.py), so it's safe
  # to skip with `docker compose up postgres redis` during early dev.
  triton:
    build:
      context: ./triton
      dockerfile: Dockerfile
    image: querymind/triton-bge-m3:local
    container_name: qm_triton
    command:
      - tritonserver
      - --model-repository=/models
      - --http-port=8001
      - --strict-model-config=false
      - --log-verbose=1
    environment:
      # Force CPU mode so the image works on GPU-less hosts. Unset or
      # set to "0" to let sentence-transformers pick CUDA when the
      # image is rebuilt with a CUDA torch wheel.
      TRITON_FORCE_CPU: "1"
    ports:
      - "8001:8001"   # HTTP — matches Settings.TRITON_URL default
      - "8002:8002"   # Prometheus metrics
    volumes:
      - ./triton/model_repository:/models:ro
      - triton_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/v2/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s  # bge-m3 download + load on first run
    networks:
      - qm_dev
    # Uncomment to enable GPU acceleration (rebuild the Dockerfile with
    # CUDA torch first).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: ["gpu"]

  # ---------------------------------------------------------------------
  # Per-dialect dev databases.
  #
  # The four blocks below are commented out so the default
  # `docker compose -f infra/docker-compose.dev.yml up -d` only brings
  # up Postgres (metadata) + Redis (Celery broker). Uncomment the
  # service AND its matching volume in the `volumes:` section at the
  # bottom of this file to enable a dialect locally, then re-run
  # `docker compose up -d`.
  #
  # Each seed file under ./seed/ is mounted into the container's init
  # directory and runs on first start (i.e. against an empty data
  # volume). To re-seed, `docker compose down -v` then `up -d` again.
  # ---------------------------------------------------------------------

  # MySQL 8.4 — auto-loads ./seed/mysql_demo.sql on first start.
  # Add-Connection form fields:
  #   Dialect: mysql   Host: localhost  Port: 3306
  #   Database: sales_demo   User: querymind   Password: querymind
  # First start is fast (~10s).
  #
  # mysql:
  #   image: mysql:8.4
  #   container_name: qm_mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: querymind
  #     MYSQL_DATABASE: sales_demo
  #     MYSQL_USER: querymind
  #     MYSQL_PASSWORD: querymind
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #     - ./seed/mysql_demo.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "querymind", "-pquerymind"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20
  #   networks:
  #     - qm_dev

  # ClickHouse 24.8 — auto-loads ./seed/clickhouse_demo.sql on first start.
  # Add-Connection form fields:
  #   Dialect: clickhouse   Host: localhost   Port: 8123 (HTTP)
  #   Database: sales_demo   User: querymind   Password: querymind
  # 9000 is the native protocol port if you prefer the native driver.
  # First start is fast (~15s).
  #
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24.8
  #   container_name: qm_clickhouse
  #   environment:
  #     CLICKHOUSE_DB: sales_demo
  #     CLICKHOUSE_USER: querymind
  #     CLICKHOUSE_PASSWORD: querymind
  #     CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
  #   ports:
  #     - "8123:8123"
  #     - "9000:9000"
  #   volumes:
  #     - clickhouse_data:/var/lib/clickhouse
  #     - ./seed/clickhouse_demo.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
  #   ulimits:
  #     nofile:
  #       soft: 262144
  #       hard: 262144
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8123/ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20
  #   networks:
  #     - qm_dev

  # MongoDB 7 — auto-loads ./seed/mongo_demo.js on first start.
  # Add-Connection form fields:
  #   Dialect: mongodb   Host: localhost   Port: 27017
  #   Database: sales_demo   User: querymind   Password: querymind
  #   (the mongo driver also needs ?authSource=admin in the URI)
  # First start is fast (~10s).
  #
  # mongodb:
  #   image: mongo:7
  #   container_name: qm_mongodb
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: querymind
  #     MONGO_INITDB_ROOT_PASSWORD: querymind
  #     MONGO_INITDB_DATABASE: sales_demo
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb_data:/data/db
  #     - ./seed/mongo_demo.js:/docker-entrypoint-initdb.d/01-seed.js:ro
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20
  #   networks:
  #     - qm_dev

  # Oracle XE 21c — auto-loads ./seed/oracle_demo.sql on first start.
  # Add-Connection form fields:
  #   Dialect: oracle   Host: localhost   Port: 1521
  #   Service: sales_demo   User: querymind   Password: querymind
  # IMPORTANT: First start is SLOW (~2 minutes) — Oracle initializes the
  # database on an empty volume. `docker logs -f qm_oracle` until you
  # see "DATABASE IS READY TO USE!". Subsequent starts are ~20s.
  #
  # oracle:
  #   image: gvenzl/oracle-xe:21-slim
  #   container_name: qm_oracle
  #   environment:
  #     ORACLE_PASSWORD: querymind
  #     APP_USER: querymind
  #     APP_USER_PASSWORD: querymind
  #     ORACLE_DATABASE: sales_demo
  #   ports:
  #     - "1521:1521"
  #   volumes:
  #     - oracle_data:/opt/oracle/oradata
  #     - ./seed/oracle_demo.sql:/container-entrypoint-initdb.d/01-seed.sql:ro
  #   healthcheck:
  #     test: ["CMD", "healthcheck.sh"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 30
  #     start_period: 120s
  #   networks:
  #     - qm_dev

networks:
  qm_dev:
    driver: bridge

# Named volumes. The four dialect-specific volumes below are commented
# out to match their (commented) service definitions above — uncomment
# a volume in tandem with the matching service.
volumes:
  pgdata:
  triton_cache:
  # mysql_data:
  # clickhouse_data:
  # mongodb_data:
  # oracle_data:
